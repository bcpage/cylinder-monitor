<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cylinder Monitor</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.png" type="image/png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 {
      color: #4fc3f7;
      font-size: 1.4rem;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }

    #status-bar {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 20px;
      min-height: 1.2em;
    }

    #status-bar.ready  { color: #66bb6a; }
    #status-bar.error  { color: #ef5350; }
    #status-bar.cal    { color: #ffa726; }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #555;
      margin-bottom: 14px;
    }

    /* Big metric display */
    #metric-speed {
      font-size: 3.5rem;
      font-weight: 700;
      color: #4fc3f7;
      text-align: center;
      line-height: 1;
    }

    #metric-delta {
      font-size: 1.1rem;
      color: #888;
      text-align: center;
      margin-top: 6px;
    }

    #metric-label {
      font-size: 0.75rem;
      color: #555;
      text-align: center;
      margin-top: 4px;
    }

    /* Controls */
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    label {
      font-size: 0.8rem;
      color: #888;
      min-width: 110px;
    }

    input[type="number"] {
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e0e0e0;
      padding: 6px 10px;
      font-size: 0.9rem;
      width: 90px;
    }

    button {
      background: #4fc3f7;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover  { background: #81d4fa; }
    button:active { background: #29b6f6; }

    button.danger {
      background: #ef5350;
      color: #fff;
    }
    button.danger:hover { background: #e57373; }

    /* Cycle log table */
    #cycle-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    #cycle-table th {
      color: #555;
      text-align: left;
      padding: 4px 8px;
      border-bottom: 1px solid #2a2a2a;
      font-weight: 400;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }

    #cycle-table td {
      padding: 6px 8px;
      border-bottom: 1px solid #1e1e1e;
      color: #ccc;
    }

    #cycle-table tr:last-child td { border-bottom: none; }

    /* Debug bar */
    #debug-bar {
      font-size: 0.72rem;
      color: #444;
      text-align: center;
      margin-top: 4px;
      min-height: 1em;
    }

    /* Cal progress */
    #cal-progress {
      height: 4px;
      background: #222;
      border-radius: 2px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    #cal-fill {
      height: 100%;
      background: #ffa726;
      width: 0%;
      transition: width 0.1s;
    }

    .empty-log {
      color: #444;
      font-size: 0.8rem;
      text-align: center;
      padding: 12px 0;
    }
  </style>
</head>
<body>

  <h1>Cylinder Monitor</h1>
  <div id="status-bar">Loading Pyodide…</div>

  <!-- Calibration progress -->
  <div id="cal-progress" style="width:100%;max-width:480px;">
    <div id="cal-fill"></div>
  </div>

  <!-- Live metric -->
  <div class="card">
    <h2>Last Measurement</h2>
    <div id="metric-speed">—</div>
    <div id="metric-delta">— ms</div>
    <div id="metric-label">in/sec &nbsp;|&nbsp; stroke time</div>
    <div id="debug-bar">baseline: — &nbsp;|&nbsp; threshold: — &nbsp;|&nbsp; hfEnergy: —</div>
  </div>

  <!-- Controls -->
  <div class="card">
    <h2>Settings</h2>
    <div class="row">
      <label>Stroke length (in)</label>
      <input type="number" id="stroke-in" value="1.0" step="0.1" min="0.1" />
    </div>
    <div class="row">
      <label>Multiplier</label>
      <input type="number" id="multiplier" value="5" step="1" min="1" />
    </div>
    <div class="row">
      <label>HF Floor</label>
      <input type="number" id="hf-floor" value="0.01" step="0.001" min="0" />
    </div>
    <div class="row" style="margin-top:6px; gap:12px;">
      <button id="btn-start">Start</button>
      <button id="btn-reset" class="danger">Reset</button>
    </div>
  </div>

  <!-- Cycle log -->
  <div class="card">
    <h2>Cycle Log</h2>
    <table id="cycle-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Time</th>
          <th>Delta (ms)</th>
          <th>Speed (in/s)</th>
        </tr>
      </thead>
      <tbody id="cycle-body">
        <tr><td colspan="4" class="empty-log">No cycles yet</td></tr>
      </tbody>
    </table>
  </div>

<script type="module">
// ─── Pyodide bootstrap ────────────────────────────────────────────────────────
const statusBar = document.getElementById('status-bar');

function setStatus(msg, cls = '') {
  statusBar.textContent = msg;
  statusBar.className = cls;
}

setStatus('Loading Pyodide…', 'cal');

// Load Pyodide from CDN
const pyodide = await loadPyodide({
  indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/'
});

setStatus('Loading numpy…', 'cal');
await pyodide.loadPackage('numpy');

setStatus('Loading detector…', 'cal');
const detectorCode = await fetch('detector.py').then(r => r.text());
await pyodide.runPythonAsync(detectorCode);

setStatus('Ready — press Start', 'ready');

// ─── State ────────────────────────────────────────────────────────────────────
let audioCtx   = null;
let processor  = null;
let running    = false;
let currentBaseline  = null;
let currentThreshold = null;

// ─── UI helpers ──────────────────────────────────────────────────────────────
const calFill     = document.getElementById('cal-fill');
const metricSpeed = document.getElementById('metric-speed');
const metricDelta = document.getElementById('metric-delta');
const debugBar    = document.getElementById('debug-bar');
const cycleBody   = document.getElementById('cycle-body');

function updateCalUI(pct) {
  calFill.style.width = pct + '%';
  setStatus(`Calibrating… ${pct}%`, 'cal');
}

function onReady() {
  calFill.style.width = '100%';
  calFill.style.background = '#66bb6a';
  setStatus('Listening…', 'ready');
}

function updateDebug(baseline, hfEnergy) {
  const thr = baseline ? (baseline * parseFloat(document.getElementById('multiplier').value)).toFixed(5) : '—';
  const bl  = baseline ? baseline.toFixed(5) : '—';
  const hf  = hfEnergy !== undefined ? hfEnergy.toFixed(5) : '—';
  debugBar.textContent = `baseline: ${bl}  |  threshold: ${thr}  |  hfEnergy: ${hf}`;
}

function addCycleToUI(n, delta_ms, speed, ts) {
  // Remove empty placeholder
  const empty = cycleBody.querySelector('.empty-log');
  if (empty) empty.parentElement.remove();

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>${n}</td>
    <td>${ts}</td>
    <td>${delta_ms.toFixed(2)}</td>
    <td>${speed.toFixed(3)}</td>
  `;
  // Prepend so newest is at top
  cycleBody.insertBefore(tr, cycleBody.firstChild);

  // Update big metric
  metricSpeed.textContent = speed.toFixed(2);
  metricDelta.textContent = delta_ms.toFixed(2) + ' ms';
  metricSpeed.style.color = '#66bb6a';
  setTimeout(() => { metricSpeed.style.color = '#4fc3f7'; }, 600);
}

function updateStatusUI(status) {
  const labels = {
    listen:    'Listening…',
    breakaway: '⚡ Breakaway detected',
    debounce:  'Debounce…',
    noise:     'Noise (too short)',
    timeout:   'Timeout — reset',
  };
  if (labels[status]) setStatus(labels[status], status === 'breakaway' ? 'cal' : 'ready');
}

// ─── Audio pipeline ───────────────────────────────────────────────────────────
async function startAudio() {
  audioCtx = new AudioContext({ sampleRate: 48000 });
  await audioCtx.audioWorklet.addModule('processor.js');

  const stream = await navigator.mediaDevices.getUserMedia({
    audio: {
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl:  false,
      sampleRate:       48000,
      channelCount:     2
    }
  });

  const source = audioCtx.createMediaStreamSource(stream);

  processor = new AudioWorkletNode(audioCtx, 'cylinder-processor', {
    processorOptions: {
      chunkSamples: 480,
      sampleRate:   48000,
      hfBinLow:     10,
      hfBinHigh:    100,
      hfFloor:      parseFloat(document.getElementById('hf-floor').value)
    }
  });

  // ── Message handler ──────────────────────────────────────────────────────
  processor.port.onmessage = async (e) => {

    if (e.data.type === 'rms') {
      // Feed single RMS value to Pyodide for calibration / adaptive baseline
      // We pass a flat array of identical values — cal only needs the RMS magnitude
      try {
        const samples = new Array(480).fill(e.data.value);
        const result  = await pyodide.runPythonAsync(
          `process_chunk([${samples.join(',')}])`
        );
        const [status] = result.toJs ? result.toJs() : result;

        if (typeof status === 'string' && status.startsWith('cal:')) {
          const pct = parseInt(status.split(':')[1]);
          updateCalUI(pct);
        } else if (status === 'ready') {
          onReady();
          // Get initial baseline and push threshold to worklet
          currentBaseline = await pyodide.runPythonAsync('get_baseline()');
          currentThreshold = currentBaseline * parseFloat(document.getElementById('multiplier').value);
          processor.port.postMessage({ type: 'set_threshold', value: currentThreshold });
          updateDebug(currentBaseline, undefined);
        }
      } catch (err) {
        console.warn('rms handler error:', err);
      }
    }

    if (e.data.type === 'gated') {
      // FFT gate fired — chunk was loud but low-frequency, discarded
      console.debug('gated chunk — rms:', e.data.rms.toFixed(5), 'hfEnergy:', e.data.hfEnergy.toFixed(5));
      updateDebug(currentBaseline, e.data.hfEnergy);
    }

    if (e.data.type === 'spike') {
      // Passed RMS threshold AND FFT gate — send to Pyodide for cycle logic
      try {
        const samples = new Array(480).fill(e.data.rms);
        const result  = await pyodide.runPythonAsync(
          `process_chunk([${samples.join(',')}])`
        );
        const arr = result.toJs ? result.toJs() : result;
        const [status, n, delta_ms, speed, ts] = arr;

        updateDebug(currentBaseline, e.data.hfEnergy);

        if (status === 'cycle') {
          addCycleToUI(n, delta_ms, speed, ts);
        } else {
          updateStatusUI(status);
        }

        // Refresh adaptive baseline and push updated threshold to worklet
        currentBaseline  = await pyodide.runPythonAsync('get_baseline()');
        if (currentBaseline) {
          currentThreshold = currentBaseline * parseFloat(document.getElementById('multiplier').value);
          processor.port.postMessage({ type: 'set_threshold', value: currentThreshold });
        }
      } catch (err) {
        console.warn('spike handler error:', err);
      }
    }
  };

  source.connect(processor);
  processor.connect(audioCtx.destination);
}

// ─── Button handlers ──────────────────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', async () => {
  if (running) return;
  running = true;
  document.getElementById('btn-start').disabled = true;

  // Apply settings to Pyodide tracker
  const strokeIn   = parseFloat(document.getElementById('stroke-in').value)   || 1.0;
  const multiplier = parseFloat(document.getElementById('multiplier').value)   || 5;
  await pyodide.runPythonAsync(`reset_tracker(stroke_in=${strokeIn}, multiplier=${multiplier})`);

  // Reset cal bar
  calFill.style.background = '#ffa726';
  calFill.style.width = '0%';

  setStatus('Starting mic…', 'cal');
  try {
    await startAudio();
  } catch (err) {
    setStatus('Mic error: ' + err.message, 'error');
    running = false;
    document.getElementById('btn-start').disabled = false;
  }
});

document.getElementById('btn-reset').addEventListener('click', async () => {
  if (audioCtx) {
    await audioCtx.close();
    audioCtx  = null;
    processor = null;
  }
  running = false;
  document.getElementById('btn-start').disabled = false;

  const strokeIn   = parseFloat(document.getElementById('stroke-in').value)   || 1.0;
  const multiplier = parseFloat(document.getElementById('multiplier').value)   || 5;
  await pyodide.runPythonAsync(`reset_tracker(stroke_in=${strokeIn}, multiplier=${multiplier})`);

  calFill.style.width = '0%';
  calFill.style.background = '#ffa726';
  metricSpeed.textContent = '—';
  metricDelta.textContent = '— ms';
  metricSpeed.style.color = '#4fc3f7';
  cycleBody.innerHTML = '<tr><td colspan="4" class="empty-log">No cycles yet</td></tr>';
  debugBar.textContent = 'baseline: — | threshold: — | hfEnergy: —';
  setStatus('Ready — press Start', 'ready');
});

// ─── Service worker registration ──────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service_worker.js').catch(console.warn);
}
</script>

<!-- Pyodide loader — must be in <body> after <script type="module"> reference -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>

</body>
</html>
