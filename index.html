<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cylinder Monitor</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a; color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center;
      padding-top: 70px; padding-bottom: 24px; padding-left: 16px; padding-right: 16px;
    }
    #fixed-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: #0a0a0a; border-bottom: 1px solid #1e1e1e;
      display: flex; flex-direction: column; align-items: center;
      padding: 10px 16px 8px;
    }
    h1 { color: #4fc3f7; font-size: 1.4rem; letter-spacing: 0.05em; }
    #status-bar { font-size: 0.85rem; color: #888; min-height: 1.2em; margin-top: 2px; }
    #status-bar.ready { color: #66bb6a; }
    #status-bar.error { color: #ef5350; }
    #status-bar.cal   { color: #ffa726; }
    .card {
      background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 10px; padding: 20px;
      width: 100%; max-width: 480px; margin-bottom: 16px;
    }
    .card h2 {
      font-size: 0.8rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: #555; margin-bottom: 14px;
    }
    #metric-speed { font-size: 3.5rem; font-weight: 700; color: #4fc3f7; text-align: center; line-height: 1; }
    #metric-delta { font-size: 1.1rem; color: #888; text-align: center; margin-top: 6px; }
    #metric-label { font-size: 0.75rem; color: #555; text-align: center; margin-top: 4px; }
    #debug-bar    { font-size: 0.72rem; color: #444; text-align: center; margin-top: 8px; min-height: 1em; }
    #cal-progress { height: 4px; background: #222; border-radius: 2px; margin-bottom: 14px; overflow: hidden; }
    #cal-fill     { height: 100%; background: #ffa726; width: 0%; transition: width 0.1s; }

    /* Cycle log */
    #cycle-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    #cycle-table th {
      color: #555; text-align: left; padding: 4px 8px;
      border-bottom: 1px solid #2a2a2a; font-weight: 400;
      text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.08em;
    }
    #cycle-table td { padding: 6px 8px; border-bottom: 1px solid #1e1e1e; color: #ccc; }
    #cycle-table tr:last-child td { border-bottom: none; }
    .col-rms, .col-hf { display: none; }
    body.show-rms .col-rms { display: table-cell; }
    body.show-hf  .col-hf  { display: table-cell; }
    .empty-log { color: #444; font-size: 0.8rem; text-align: center; padding: 12px 0; }
    td.unmatched { color: #ef5350; }
    td.confirmed { color: #66bb6a; }

    /* Settings */
    .row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    label { font-size: 0.8rem; color: #888; min-width: 150px; }
    input[type="number"] {
      background: #111; border: 1px solid #333; border-radius: 6px;
      color: #e0e0e0; padding: 6px 10px; font-size: 0.9rem; width: 90px;
    }
    .check-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .check-row label { min-width: unset; font-size: 0.8rem; color: #888; }
    input[type="checkbox"] { accent-color: #4fc3f7; width: 15px; height: 15px; cursor: pointer; }
    button {
      background: #4fc3f7; color: #000; border: none; border-radius: 8px;
      padding: 10px 22px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    button:hover  { background: #81d4fa; }
    button:active { background: #29b6f6; }
    button.danger       { background: #ef5350; color: #fff; }
    button.danger:hover { background: #e57373; }
    .section-label {
      font-size: 0.75rem; color: #555; text-transform: uppercase;
      letter-spacing: 0.08em; margin-top: 10px; margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div id="fixed-header">
    <h1>Cylinder Monitor</h1>
    <div id="status-bar">Loading Pyodide…</div>
  </div>

  <!-- Last Measurement -->
  <div class="card">
    <h2>Last Measurement</h2>
    <div id="cal-progress"><div id="cal-fill"></div></div>
    <div id="metric-speed">—</div>
    <div id="metric-delta">— ms</div>
    <div id="metric-label">in/sec &nbsp;|&nbsp; stroke time</div>
    <div id="debug-bar">baseline: — | threshold: — | hfEnergy: —</div>
  </div>

  <!-- Cycle Log -->
  <div class="card">
    <h2>Cycle Log</h2>
    <table id="cycle-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Time</th>
          <th>Delta (ms)</th>
          <th>Speed (in/s)</th>
          <th>Status</th>
          <th class="col-rms">T_start RMS×</th>
          <th class="col-rms">T_end RMS×</th>
          <th class="col-hf">HF×</th>
        </tr>
      </thead>
      <tbody id="cycle-body">
        <tr><td colspan="8" class="empty-log">No cycles yet</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Settings -->
  <div class="card">
    <h2>Settings</h2>

    <div class="section-label">Detection</div>
    <div class="row">
      <label>Stroke length (in)</label>
      <input type="number" id="stroke-in" value="1.0" step="0.1" min="0.1" />
    </div>
    <div class="row">
      <label>Impact multiplier</label>
      <input type="number" id="impact-mult" value="5" step="1" min="1" />
    </div>
    <div class="row">
      <label>Breakaway multiplier</label>
      <input type="number" id="breakaway-mult" value="3" step="0.5" min="0.5" />
    </div>
    <div class="row">
      <label>HF Floor</label>
      <input type="number" id="hf-floor" value="0.01" step="0.001" min="0" />
    </div>
    <div class="row">
      <label>Debounce (ms)</label>
      <input type="number" id="debounce-ms" value="50" step="5" min="0" />
    </div>

    <div class="section-label">Lookback Window</div>
    <div class="row">
      <label>Min lookback (ms)</label>
      <input type="number" id="min-lookback" value="15" step="5" min="5" />
    </div>
    <div class="row">
      <label>Max lookback (ms)</label>
      <input type="number" id="max-lookback" value="100" step="10" min="10" />
    </div>

    <div class="section-label">Cycle Log Debug Columns</div>
    <div class="check-row">
      <input type="checkbox" id="chk-rms" />
      <label for="chk-rms">Show RMS Ratios (T_start × / T_end ×)</label>
    </div>
    <div class="check-row">
      <input type="checkbox" id="chk-hf" />
      <label for="chk-hf">Show HF Ratio</label>
    </div>

    <div class="row" style="margin-top:14px;">
      <button id="btn-start">Start</button>
      <button id="btn-reset" class="danger">Reset</button>
    </div>
  </div>

  <script type="module">
    (async () => {
      const statusBar   = document.getElementById('status-bar');
      const calFill     = document.getElementById('cal-fill');
      const metricSpeed = document.getElementById('metric-speed');
      const metricDelta = document.getElementById('metric-delta');
      const debugBar    = document.getElementById('debug-bar');
      const cycleBody   = document.getElementById('cycle-body');

      document.getElementById('chk-rms').addEventListener('change', e =>
        document.body.classList.toggle('show-rms', e.target.checked));
      document.getElementById('chk-hf').addEventListener('change', e =>
        document.body.classList.toggle('show-hf', e.target.checked));

      function setStatus(msg, cls = '') {
        statusBar.textContent = msg; statusBar.className = cls;
      }
      function updateDebug(baseline, threshold, hfEnergy) {
        const bl  = baseline  != null ? baseline.toFixed(5)  : '—';
        const thr = threshold != null ? threshold.toFixed(5) : '—';
        const hf  = hfEnergy  != null ? hfEnergy.toFixed(5)  : '—';
        debugBar.textContent = `baseline: ${bl} | threshold: ${thr} | hfEnergy: ${hf}`;
      }

      function addCycleToUI(n, delta_ms, speed, ts, status, tend_rms, tstart_rms, hfEnergy, threshold) {
        const empty = cycleBody.querySelector('.empty-log');
        if (empty) empty.parentElement.remove();

        const isConfirmed = status === 'cycle';
        const statusCell  = isConfirmed ? '✓' : '✗ no T_start';
        const deltaCell   = delta_ms != null ? parseFloat(delta_ms).toFixed(2) : '—';
        const speedCell   = speed    != null ? parseFloat(speed).toFixed(3)    : '—';

        // Ratios relative to impact threshold
        const tStartRatio = (tstart_rms != null && threshold) ? (tstart_rms / threshold).toFixed(2) + '×' : '—';
        const tEndRatio   = (tend_rms   != null && threshold) ? (tend_rms   / threshold).toFixed(2) + '×' : '—';
        const hfRatio     = (hfEnergy   != null && threshold) ? (hfEnergy   / threshold).toFixed(2) + '×' : '—';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${n}</td>
          <td>${ts}</td>
          <td class="${isConfirmed ? 'confirmed' : 'unmatched'}">${deltaCell}</td>
          <td>${speedCell}</td>
          <td class="${isConfirmed ? 'confirmed' : 'unmatched'}">${statusCell}</td>
          <td class="col-rms">${tStartRatio}</td>
          <td class="col-rms">${tEndRatio}</td>
          <td class="col-hf">${hfRatio}</td>`;
        cycleBody.insertBefore(tr, cycleBody.firstChild);

        if (isConfirmed) {
          metricSpeed.textContent = parseFloat(speed).toFixed(2);
          metricDelta.textContent = parseFloat(delta_ms).toFixed(2) + ' ms';
          metricSpeed.style.color = '#66bb6a';
          setTimeout(() => { metricSpeed.style.color = '#4fc3f7'; }, 600);
        }
      }

      // ── Pyodide init ─────────────────────────────────────────────────────
      setStatus('Loading Pyodide…', 'cal');
      const pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/' });
      setStatus('Loading numpy…', 'cal');
      await pyodide.loadPackage('numpy');
      setStatus('Loading detector…', 'cal');
      const detectorCode = await fetch('detector.py').then(r => r.text());
      await pyodide.runPythonAsync(detectorCode);
      setStatus('Ready — press Start', 'ready');

      // ── State ─────────────────────────────────────────────────────────────
      let audioCtx = null, processor = null;
      let running = false, calDone = false;
      let currentBaseline = null, currentThreshold = null;

      // ── Settings helpers ──────────────────────────────────────────────────
      const g = id => parseFloat(document.getElementById(id).value);
      function getSettings() {
        return {
          strokeIn:      g('stroke-in')      || 1.0,
          impactMult:    g('impact-mult')     || 5,
          breakawayMult: g('breakaway-mult')  || 3,
          hfFloor:       g('hf-floor'),
          debounceMs:    g('debounce-ms')     || 50,
          minLookback:   g('min-lookback')    || 15,
          maxLookback:   g('max-lookback')    || 100,
        };
      }

      // ── Audio pipeline ────────────────────────────────────────────────────
      async function startAudio() {
        const s = getSettings();
        audioCtx = new AudioContext({ sampleRate: 48000 });
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        await audioCtx.audioWorklet.addModule('processor.js');

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 2 }
        });

        const source = audioCtx.createMediaStreamSource(stream);
        processor = new AudioWorkletNode(audioCtx, 'cylinder-processor', {
          processorOptions: {
            chunkSamples: 480, sampleRate: 48000,
            hfBinLow: 10, hfBinHigh: 100,
            hfFloor: s.hfFloor,
            debounceMs: s.debounceMs        // FIX: pass debounce at construction
          }
        });

        processor.port.onmessage = async (e) => {

          // ── Calibration RMS ───────────────────────────────────────────────
          if (e.data.type === 'rms') {
            if (calDone) return;
            try {
              // FIX: use audioCtx.currentTime as timestamp, not the RMS value
              const result = await pyodide.runPythonAsync(
                `process_chunk(${e.data.value}, ${audioCtx.currentTime})`
              );
              const arr    = result.toJs ? result.toJs() : Array.from(result);
              const status = arr[0];
              if (typeof status === 'string' && status.startsWith('cal:')) {
                const pct = parseInt(status.split(':')[1]);
                calFill.style.width = pct + '%';
                setStatus(`Calibrating… ${pct}%`, 'cal');
              } else if (status === 'ready') {
                calDone = true;
                calFill.style.width = '100%';
                calFill.style.background = '#66bb6a';
                setStatus('Listening…', 'ready');
                currentBaseline  = await pyodide.runPythonAsync('get_baseline()');
                currentThreshold = currentBaseline * s.impactMult;
                processor.port.postMessage({ type: 'set_threshold', value: currentThreshold });
                updateDebug(currentBaseline, currentThreshold, null);
              }
            } catch (err) { console.warn('rms error:', err); }
          }

          // ── Gated ─────────────────────────────────────────────────────────
          if (e.data.type === 'gated') {
            console.debug('GATED rms:', e.data.rms.toFixed(5), 'hf:', e.data.hfEnergy.toFixed(5));
            updateDebug(currentBaseline, currentThreshold, e.data.hfEnergy);
          }

          // ── Spike (hard hit) — run lookback in Python ─────────────────────
          if (e.data.type === 'spike') {
            console.log('SPIKE rms:', e.data.rms.toFixed(5), 'hf:', e.data.hfEnergy.toFixed(5));
            updateDebug(currentBaseline, currentThreshold, e.data.hfEnergy);

            try {
              const ts = e.data.timestamp / 1000;  // worklet ms → s

              // FIX: pass ring buffer as a live Python object — no JSON string interpolation
              // FIX: clear ring buffer before injection to prevent stale entry accumulation
              pyodide.globals.set('_ring_js', e.data.ringBuffer);
              await pyodide.runPythonAsync(`
tracker.ring_buffer.clear()
for _rms, _t in _ring_js:
    tracker.ring_buffer.append((_rms, _t / 1000))
`);

              const result = await pyodide.runPythonAsync(
                `process_chunk(${e.data.rms}, ${ts})`
              );
              const arr = result.toJs ? result.toJs() : Array.from(result);
              const [status, n, delta_ms, speed, logTs, tend_rms, tstart_rms] = arr;

              console.log('status:', status, 'delta_ms:', delta_ms, 'speed:', speed);

              if (status === 'cycle' || status === 'unmatched') {
                addCycleToUI(n, delta_ms, speed, logTs, status,
                             tend_rms, tstart_rms, e.data.hfEnergy, currentThreshold);
              } else {
                const labels = { listen: 'Listening…', debounce: 'Debounce…', noise: 'Noise (too short)' };
                setStatus(labels[status] || status, 'ready');
              }

              // Refresh adaptive baseline
              currentBaseline = await pyodide.runPythonAsync('get_baseline()');
              if (currentBaseline) {
                const s2 = getSettings();
                currentThreshold = currentBaseline * s2.impactMult;
                processor.port.postMessage({ type: 'set_threshold', value: currentThreshold });
              }
            } catch (err) { console.warn('spike error:', err); }
          }
        };

        source.connect(processor);
        processor.connect(audioCtx.destination);
      }

      // ── Buttons ───────────────────────────────────────────────────────────
      async function applyReset() {
        const s = getSettings();
        await pyodide.runPythonAsync(
          `reset_tracker(stroke_in=${s.strokeIn}, impact_mult=${s.impactMult}, ` +
          `breakaway_mult=${s.breakawayMult}, debounce_ms=${s.debounceMs}, ` +
          `max_lookback_ms=${s.maxLookback}, min_lookback_ms=${s.minLookback})`
        );
        // FIX: sync debounce to worklet whenever settings are applied
        if (processor) {
          processor.port.postMessage({ type: 'set_debounce', value: s.debounceMs });
        }
      }

      document.getElementById('btn-start').addEventListener('click', async () => {
        if (running) return;
        running = true; calDone = false;
        document.getElementById('btn-start').disabled = true;
        await applyReset();
        calFill.style.background = '#ffa726'; calFill.style.width = '0%';
        setStatus('Starting mic…', 'cal');
        try { await startAudio(); }
        catch (err) {
          setStatus('Mic error: ' + err.message, 'error');
          running = false;
          document.getElementById('btn-start').disabled = false;
        }
      });

      document.getElementById('btn-reset').addEventListener('click', async () => {
        if (audioCtx) { await audioCtx.close(); audioCtx = null; processor = null; }
        running = false; calDone = false;
        currentBaseline = null; currentThreshold = null;
        document.getElementById('btn-start').disabled = false;
        await applyReset();
        calFill.style.width = '0%'; calFill.style.background = '#ffa726';
        metricSpeed.textContent = '—'; metricDelta.textContent = '— ms';
        metricSpeed.style.color = '#4fc3f7';
        cycleBody.innerHTML = '<tr><td colspan="8" class="empty-log">No cycles yet</td></tr>';
        debugBar.textContent = 'baseline: — | threshold: — | hfEnergy: —';
        setStatus('Ready — press Start', 'ready');
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service_worker.js').catch(console.warn);
      }
    })();
  </script>
</body>
</html>
