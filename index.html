<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cylinder Monitor</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 16px;
    }
    h1 { color: #4fc3f7; font-size: 1.1em; margin-bottom: 12px; text-align: center; }

    #status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.85em;
      color: #555;
    }
    #dot { font-size: 1.2em; }

    #big-display {
      background: #141414;
      border: 1px solid #2a2a2a;
      padding: 16px;
      margin-bottom: 12px;
    }
    #lbl-last { font-size: 0.75em; color: #555; margin-bottom: 4px; }
    #lbl-time { font-size: 2.4em; font-weight: bold; color: #f0f0f0; }
    #lbl-speed { font-size: 1.4em; color: #4fc3f7; margin-top: 4px; }

    #stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat {
      background: #141414;
      border: 1px solid #2a2a2a;
      padding: 8px;
    }
    .stat-label { font-size: 0.7em; color: #555; }
    .stat-value { font-size: 1em; color: #f0f0f0; margin-top: 2px; }

    #lap-header {
      display: grid;
      grid-template-columns: 2fr 3fr 3fr 3fr;
      font-size: 0.75em;
      color: #555;
      padding: 4px 0;
      border-bottom: 1px solid #2a2a2a;
      margin-bottom: 4px;
    }
    #lap-list {
      flex: 1;
      overflow-y: auto;
      max-height: 240px;
      margin-bottom: 12px;
    }
    .lap-row {
      display: grid;
      grid-template-columns: 2fr 3fr 3fr 3fr;
      font-size: 0.85em;
      padding: 5px 0;
      border-bottom: 1px solid #1a1a1a;
    }

    #controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      font-family: monospace;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
    }
    #btn-start { background: #66bb6a; color: #0a0a0a; }
    #btn-start.stop { background: #ef5350; color: #f0f0f0; }
    #btn-reset { background: #1e1e1e; color: #f0f0f0; }

    #settings {
      display: flex;
      gap: 16px;
      font-size: 0.85em;
      color: #555;
      margin-bottom: 8px;
    }
    #settings label { display: flex; flex-direction: column; gap: 4px; }
    #settings input {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      color: #f0f0f0;
      font-family: monospace;
      font-size: 0.95em;
      padding: 4px 6px;
      width: 70px;
    }

    #mode-bar {
      font-size: 0.75em;
      color: #333;
      text-align: center;
      padding-top: 4px;
    }
  </style>
</head>
<body>
  <h1>CYLINDER MONITOR</h1>

  <div id="status-bar">
    <span id="dot">●</span>
    <span id="status-text">Loading Python...</span>
  </div>

  <div id="big-display">
    <div id="lbl-last">LAST CYCLE</div>
    <div id="lbl-time">--:--.---</div>
    <div id="lbl-speed">— in/sec</div>
  </div>

  <div id="stats-bar">
    <div class="stat"><div class="stat-label">AVG</div><div class="stat-value" id="s-avg">—</div></div>
    <div class="stat"><div class="stat-label">BEST</div><div class="stat-value" id="s-best">—</div></div>
    <div class="stat"><div class="stat-label">WORST</div><div class="stat-value" id="s-worst">—</div></div>
    <div class="stat"><div class="stat-label">COUNT</div><div class="stat-value" id="s-count">—</div></div>
  </div>

  <div id="lap-header">
    <span>#</span><span>ms</span><span>in/sec</span><span>time</span>
  </div>
  <div id="lap-list"></div>

  <div id="controls">
    <button id="btn-start" disabled>START</button>
    <button id="btn-reset">RESET</button>
  </div>

  <div id="settings">
    <label>Stroke (in)<input id="inp-stroke" type="number" value="1.0" step="0.1"></label>
    <label>Threshold ×<input id="inp-thresh" type="number" value="30" step="1"></label>
  </div>

  <div id="mode-bar" id="mode-bar">—</div>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.0/full/pyodide.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service_worker.js");
    }

    // ── DOM refs ──────────────────────────────────────────────────
    const dot        = document.getElementById("dot");
    const statusText = document.getElementById("status-text");
    const lblTime    = document.getElementById("lbl-time");
    const lblSpeed   = document.getElementById("lbl-speed");
    const sAvg       = document.getElementById("s-avg");
    const sBest      = document.getElementById("s-best");
    const sWorst     = document.getElementById("s-worst");
    const sCount     = document.getElementById("s-count");
    const lapList    = document.getElementById("lap-list");
    const btnStart   = document.getElementById("btn-start");
    const btnReset   = document.getElementById("btn-reset");
    const inpStroke  = document.getElementById("inp-stroke");
    const inpThresh  = document.getElementById("inp-thresh");
    const modeBar    = document.getElementById("mode-bar");

    // ── State ─────────────────────────────────────────────────────
    let pyodide       = null;
    let audioCtx      = null;
    let workletNode   = null;
    let sourceNode    = null;
    let running       = false;
    let cycles        = [];

    // ── Colors ────────────────────────────────────────────────────
    const CYAN  = "#4fc3f7";
    const RED   = "#ef5350";
    const GREEN = "#66bb6a";
    const AMBER = "#ffb300";
    const WHITE = "#f0f0f0";
    const MUTED = "#555555";

    function setStatus(txt, col = MUTED) {
      statusText.textContent = txt;
      statusText.style.color = col;
      dot.style.color = col;
    }

    // ── Load Pyodide + detector.py ────────────────────────────────
    async function initPython() {
      setStatus("Loading Python...", AMBER);
      pyodide = await loadPyodide();

      // Fetch and run detector.py
      const resp = await fetch("detector.py");
      const code = await resp.text();
      await pyodide.runPythonAsync(code);

      setStatus("Ready — press START", MUTED);
      btnStart.disabled = false;
    }

    // ── Audio setup ───────────────────────────────────────────────
    async function startAudio() {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl:  false,
          sampleRate:       48000
        }
      });

      audioCtx = new AudioContext({ sampleRate: 48000 });
      await audioCtx.audioWorklet.addModule("processor.js");

      sourceNode  = audioCtx.createMediaStreamSource(stream);
      workletNode = new AudioWorkletNode(audioCtx, "cylinder-processor");

      workletNode.port.onmessage = async (e) => {
        if (!running) return;
        const chunk = e.data.chunk;
        await processChunk(chunk);
      };

      sourceNode.connect(workletNode);
      workletNode.connect(audioCtx.destination);

      modeBar.textContent = "LIVE MIC — 48kHz";
    }

    // ── Send chunk to Python ──────────────────────────────────────
    async function processChunk(chunk) {
      const arr = pyodide.toPy(Array.from(chunk));
      const result = await pyodide.runPythonAsync(
        `process_chunk(${JSON.stringify(Array.from(chunk))})`
      );
      const [status, n, delta_ms, speed, ts] = result.toJs();
      handleStatus(status, n, delta_ms, speed, ts);
    }

    // ── Handle detection results ──────────────────────────────────
    function handleStatus(status, n, delta_ms, speed, ts) {
      if (status && status.startsWith("cal:")) {
        const pct = status.split(":")[1];
        setStatus(`Calibrating... ${pct}%`, AMBER);
      } else if (status === "ready") {
        setStatus("Ready — listening for breakaway", GREEN);
      } else if (status === "breakaway") {
        setStatus("Breakaway detected → waiting for end", CYAN);
      } else if (status === "cycle") {
        onCycle(n, delta_ms, speed, ts);
      } else if (status === "timeout") {
        setStatus("Timeout — reset", AMBER);
      } else if (status === "noise") {
        setStatus("Noise spike ignored", MUTED);
      }
    }

    // ── Cycle complete ────────────────────────────────────────────
    function onCycle(n, delta_ms, speed, ts) {
      cycles.push({ n, delta_ms, speed, ts });

      const deltas = cycles.map(c => c.delta_ms);
      const best   = Math.min(...deltas);
      const worst  = Math.max(...deltas);
      const avg    = deltas.reduce((a, b) => a + b, 0) / deltas.length;

      const col = cycles.length > 1
        ? (delta_ms === best ? CYAN : delta_ms === worst ? RED : WHITE)
        : WHITE;

      // Big display
      const mins = Math.floor(delta_ms / 60000);
      const secs = Math.floor((delta_ms % 60000) / 1000);
      const mil  = Math.floor(delta_ms % 1000);
      lblTime.textContent  = `${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}.${String(mil).padStart(3,"0")}`;
      lblTime.style.color  = col;
      lblSpeed.textContent = `${speed.toFixed(2)} in/sec`;
      lblSpeed.style.color = col;

      // Stats
      sAvg.textContent   = `${avg.toFixed(0)}ms`;
      sBest.textContent  = `${best.toFixed(0)}ms`;
      sWorst.textContent = `${worst.toFixed(0)}ms`;
      sCount.textContent = cycles.length;

      // Lap row
      addLapRow(n, delta_ms, speed, ts, col);
      setStatus("Cycle complete — listening", GREEN);
    }

    function addLapRow(n, delta_ms, speed, ts, col) {
      const row = document.createElement("div");
      row.className = "lap-row";
      row.style.color = col;
      row.innerHTML = `
        <span>${String(n).padStart(2,"0")}</span>
        <span>${delta_ms.toFixed(1)}</span>
        <span>${speed.toFixed(2)}</span>
        <span style="color:#555">${ts}</span>
      `;
      lapList.insertBefore(row, lapList.firstChild);
    }

    // ── Controls ──────────────────────────────────────────────────
    btnStart.addEventListener("click", async () => {
      if (!running) {
        running = true;
        btnStart.textContent = "STOP";
        btnStart.classList.add("stop");

        const stroke = parseFloat(inpStroke.value) || 1.0;
        const thresh = parseFloat(inpThresh.value) || 30;
        await pyodide.runPythonAsync(
          `reset_tracker(stroke_in=${stroke}, multiplier=${thresh})`
        );

        try {
          await startAudio();
          setStatus("Calibrating...", AMBER);
        } catch (err) {
          setStatus("Mic error: " + err.message, RED);
          running = false;
          btnStart.textContent = "START";
          btnStart.classList.remove("stop");
        }
      } else {
        running = false;
        btnStart.textContent = "START";
        btnStart.classList.remove("stop");
        if (audioCtx) { audioCtx.close(); audioCtx = null; }
        setStatus("Stopped", MUTED);
        modeBar.textContent = "—";
      }
    });

    btnReset.addEventListener("click", async () => {
      running = false;
      btnStart.textContent = "START";
      btnStart.classList.remove("stop");
      if (audioCtx) { audioCtx.close(); audioCtx = null; }
      cycles = [];
      lblTime.textContent  = "--:--.---";
      lblTime.style.color  = WHITE;
      lblSpeed.textContent = "— in/sec";
      lblSpeed.style.color = CYAN;
      sAvg.textContent = sBest.textContent = sWorst.textContent = sCount.textContent = "—";
      lapList.innerHTML = "";
      modeBar.textContent = "—";
      await pyodide.runPythonAsync("reset_tracker()");
      setStatus("Reset — press START", MUTED);
    });

    // ── Boot ──────────────────────────────────────────────────────
    initPython();
  </script>
</body>
</html>
