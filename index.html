<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cylinder Monitor</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    h1 { color: #4fc3f7; font-size: 1.2em; margin-bottom: 24px; }
    #status {
      font-size: 1em;
      color: #555;
      margin-bottom: 16px;
    }
    #output {
      background: #141414;
      border: 1px solid #2a2a2a;
      padding: 16px;
      width: 100%;
      max-width: 480px;
      min-height: 80px;
      font-size: 0.95em;
      white-space: pre-wrap;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      padding: 12px 32px;
      background: #66bb6a;
      color: #0a0a0a;
      border: none;
      font-family: monospace;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>CYLINDER MONITOR</h1>
  <div id="status">Loading Python...</div>
  <div id="output"></div>
  <button id="btn" disabled>Run Test</button>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.0/full/pyodide.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service_worker.js");
    }

    const status = document.getElementById("status");
    const output = document.getElementById("output");
    const btn    = document.getElementById("btn");

    async function main() {
      const pyodide = await loadPyodide();
      status.textContent = "Python ready.";
      btn.disabled = false;

      btn.addEventListener("click", async () => {
        const result = await pyodide.runPythonAsync(`
import sys, platform
f"Hello from Python {sys.version}\\nPlatform: {platform.platform()}"
        `);
        output.textContent = result;
        status.textContent = "Python executed successfully.";
      });
    }

    main().catch(e => {
      status.textContent = "Failed to load Python: " + e;
    });
  </script>
</body>
</html>
